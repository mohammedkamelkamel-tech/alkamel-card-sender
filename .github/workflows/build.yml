name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKamelCardSender-v1.1.0-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKamelCardSender-v1.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package complete project
        run: |
          git archive --format=zip --output="مشروع الكامل اونلاين النهائي.zip" HEAD

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: مشروع الكامل اونلاين النهائي
          path: مشروع الكامل اونلاين النهائي.zip
          if-no-files-found: error
