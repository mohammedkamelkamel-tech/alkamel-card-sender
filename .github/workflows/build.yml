name: Build APK from Latest Uploaded Project
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract and use latest uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'AlKamel_1.21.0_DuplicateCardFix_SOURCE*.zip' | sort | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No DuplicateCardFix source ZIP found in repository root."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p /tmp/latest-project
          unzip -q "$ZIP_FILE" -d /tmp/latest-project
          PROJECT_ROOT=$(find /tmp/latest-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Could not locate Gradle project root in uploaded ZIP."
            exit 1
          fi
          echo "Project root: $PROJECT_ROOT"
          rsync -a --delete --exclude='.git' --exclude='.github' "$PROJECT_ROOT/" "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/settings.gradle" || test -f "$GITHUB_WORKSPACE/settings.gradle.kts"

      - name: Build APKs from extracted latest source
        run: gradle :app:assembleDebug :app:assembleRelease

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKamel-1.21.0-DuplicateCardFix-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKamel-1.21.0-DuplicateCardFix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package complete extracted project
        run: zip -qr "AlKamel_1.21.0_DuplicateCardFix_PROJECT.zip" . -x ".git/*" ".github/*" "app/build/*"

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: AlKamel_1.21.0_DuplicateCardFix_PROJECT
          path: AlKamel_1.21.0_DuplicateCardFix_PROJECT.zip
          if-no-files-found: error
