name: Export Source For Maintenance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export project
        run: zip -qr alkamel-card-sender-source.zip . -x ".git/*"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-card-sender-source
          path: alkamel-card-sender-source.zip
